name: Modeler Electron Check

# Dry-run of the release packaging, so a broken Electron build shows up on
# develop / PRs instead of only when a `modeler-v*` tag is pushed on main.
# Same steps as modeler-electron-release.yml, minus the GitHub Release upload:
# installers are kept as short-lived workflow artifacts only.
on:
  push:
    branches: [develop]
    paths:
      - 'apps/modeler/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/modeler-electron-*.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/modeler/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/modeler-electron-*.yml'
  workflow_dispatch:

concurrency:
  group: electron-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    name: Package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Package Electron app
        # `dist` builds the web bundle, compiles electron/ and runs
        # electron-builder with --publish never.
        run: npm run dist --workspace=apps/modeler

      - name: Keep installers for inspection
        uses: actions/upload-artifact@v4
        with:
          name: modeler-${{ matrix.os }}
          path: |
            apps/modeler/release/*.AppImage
            apps/modeler/release/*.exe
            apps/modeler/release/*.dmg
          if-no-files-found: error
          retention-days: 3
